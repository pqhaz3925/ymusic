[package]
name = "ymusic-core"
version = "0.1.0"
edition = "2021"
description = "Rust port of MarshalX/yandex-music-api"
license = "LGPL-3.0"

[lib]
name = "ymusic_core"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
thiserror = "=2.0.21"
hmac = "=0.12.1"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
base64 = "=0.22.1"
aes = "=0.8.4"
ctr = "=0.9.2"
roxmltree = "=0.21.1"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }
log = "=0.4.34"
futures-util = "=0.3.34"
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
uniffi = { version = "=0.32.1", features = ["tokio", "cli"] }

[profile.release]
lto = "thin"
opt-level = "z"
strip = true
